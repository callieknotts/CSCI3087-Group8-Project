
databases:
  - name: my-postgres
    plan: free
    databaseName: appdb
    user: appuser

services:
  # Backend - FastAPI
  - type: web
    name: my-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3

      - key: DATABASE_URL
        fromDatabase:
          name: my-postgres
          property: connectionString

      - key: SESSION_SECRET
        generateValue: true

      - key: FRONTEND_URL
        fromService:
          type: web
          name: my-frontend
          property: host

  # Frontend - React
  - type: web
    name: my-frontend
    runtime: static
    rootDir: my-app
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: my-backend
          envVarKey: RENDER_EXTERNAL_URL

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
