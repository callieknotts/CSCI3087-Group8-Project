name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests (FastAPI / PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://appuser:apppassword@localhost:5432/testdb
      TEST_DATABASE_URL: postgresql+psycopg://appuser:apppassword@localhost:5432/testdb
      SESSION_SECRET: ci-test-secret
      PYTHONPATH: backend

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx flake8

      - name: Lint backend and tests
        run: |
          flake8 backend test --count \
            --select=E9,F63,F7,F82 \
            --show-source --statistics \
            --exclude=node_modules,venv,.venv

      - name: Check application imports
        run: python -c "from backend.main import app"

      - name: Run backend tests
        run: python -m pytest test/ -v
